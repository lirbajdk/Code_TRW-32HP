; ============================================================
;  PlatformIO Project Configuration File
;  ESP32 DevKit C - Constant TX Mode (CW) con 2x TRW24HP
; ============================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Monitor serie
monitor_speed = 115200

; Librería RF24 (TMRh20) desde el registro de PlatformIO
lib_deps =
    nrf24/RF24 @ ^1.4.9

; --------------------------------------------------------------
; NOTA sobre versión del core Arduino-ESP32:
; El código en src/main.cpp usa la API de timers "clásica"
; (timerBegin con prescaler, timerAttachInterrupt con función+edge).
; Esa API corresponde al core Arduino-ESP32 v2.x, que es el que
; PlatformIO usa por defecto con platform = espressif32 actual.
; Si en tu platformio.ini termina resolviendo un core v3.x y falla
; la compilación del timer, avisame para adaptar esa parte.
; --------------------------------------------------------------
